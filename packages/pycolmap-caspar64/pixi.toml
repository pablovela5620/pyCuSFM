[package]
# Named `pycolmap` so it satisfies colsfm's `import pycolmap` and shadows the
# conda-forge pycolmap inside the `colsfm-caspar` environment only.  The version
# matches the upstream COLMAP tag this recipe builds.
name = "pycolmap"
version = "4.2.0"

[package.build]
# Pinned so all three caspar packages are built by one known backend; the
# lock records no backend version and the local cache holds 0.4.4 and 0.4.6.
backend = { name = "pixi-build-rattler-build", version = "==0.4.6" }
