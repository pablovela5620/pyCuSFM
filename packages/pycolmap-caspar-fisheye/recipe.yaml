# rattler-build recipe for a CASPAR pycolmap 4.2.0 with an OPENCV_FISHEYE
# Caspar adapter (CUDA 13 / sm_120).
#
# This is `packages/pycolmap-caspar/recipe.yaml` plus two patches on the same
# pinned upstream source, a Step 0 integrity gate, a distinct build string and
# one real test.  The two-step build, the CUDA 13 / sm_120 pins and the
# dependency list are byte-identical to the base recipe (its header explains
# why).  Diff the two files before editing either.
#
# THE PATCHES (packages/pycolmap-caspar-fisheye/patches/, applied by
# rattler-build to the fresh upstream clone, in list order):
#   add-opencv-fisheye-caspar-adapter.patch  hand-written: OpenCVFisheyeAdapter
#       in caspar_model_adapter.h, its dispatch in bundle_adjustment_caspar.cc,
#       the opencv_fisheye residual and the SumStore padding-thread fix in
#       Symforce-Caspar/caspar_generate.py, doc/faq.rst.
#   add-opencv-fisheye-generated-f32.patch   224 new Symforce-generated kernel
#       files plus the 4 regenerated aggregates (solver.{h,cc},
#       caspar_mappings.{h,cu}) under generated/f32.  The vendored
#       PINHOLE/SIMPLE_RADIAL kernels are untouched.
# The generated CUDA travels inside the patch, so symforce is NOT a build
# dependency (conda-forge has no symforce package at any version).  The fp64
# tree exists in the fork but is not shipped: no package compiles it.
# Cut from fork commit c03b1f38 (see README.md) by tools/caspar_fisheye_patch.sh.
#
# BUILD COST: 712 CUDA translation units in generated/f32 vs 488 stock.
# See docs/caspar-fisheye-adapter.md §4 for the measured wall time.
#
# ORIGINAL HEADER FOLLOWS.
#
# rattler-build recipe for a CASPAR-enabled pycolmap 4.2.0 (CUDA 13 / sm_120).
#
# WHY THIS EXISTS: CASPAR is COLMAP's experimental GPU bundle-adjustment backend.
# It is gated behind the CMake flag -DCASPAR_ENABLED=ON, which defaults OFF, and
# no distributed binary ships it ON.  The conda-forge `pycolmap 4.2.0 cuda_130*`
# build already *exposes* `pycolmap.BundleAdjustmentBackend.CASPAR` and
# `BundleAdjustmentOptions.caspar` — the enum is always bound — but the solve
# aborts with "Caspar BA backend selected but COLMAP was built without
# CASPAR_ENABLED; rebuild with -DCASPAR_ENABLED=ON".  So the enum is not a
# capability probe; only a from-source build gives a working backend.
#
# TWO-STEP BUILD: pycolmap's pyproject sets `cmake.source-dir = "python/"`, so
# the bindings link a SEPARATELY-built colmap library — and CASPAR_ENABLED lives
# in libcolmap, not in the bindings.  Therefore: build and install libcolmap with
# CASPAR first, then build the bindings against that install prefix.
#
# ARCH: the target GPU is an RTX 5090 (compute capability 12.0, sm_120), which
# needs CUDA 13.  CASPAR's Symforce-generated kernel CMakeLists defaults to
# `75 80 86 89 75-virtual` but only `if(NOT DEFINED CMAKE_CUDA_ARCHITECTURES)`
# (src/thirdparty/Symforce-Caspar/generated/f{32,64}/CMakeLists.txt:10-11), so
# passing -DCMAKE_CUDA_ARCHITECTURES=120 explicitly is honoured and no patch is
# needed.  COLMAP 4.2.0 additionally hard-errors if CMAKE_CUDA_ARCHITECTURES is
# "native"/"all"/"all-major" while CASPAR is on, which is why the value is
# spelled out (cmake/FindDependencies.cmake:311-339).
#
# DEPENDENCY LIST: derived from the conda-forge `colmap`/`pycolmap` 4.2.0
# cuda_130 packages actually installed in this repo's `colsfm` environment,
# minus the GUI/Qt side (GUI_ENABLED=OFF).  It deliberately does NOT carry the
# MKL / fmt / faiss-cuda pins of the earlier pysfm monorepo recipe: those existed
# only to co-solve with a cuda130 PyTorch, which `colsfm-caspar` does not have.
context:
  # tag 4.2.0 -> be5e29168d4aff238409d60424812df66aac919f.
  # tools/caspar_fisheye_patch.sh reads this line as the patch base and refuses
  # to run if the two sibling recipes pin a different revision.
  colmap_rev: be5e29168d4aff238409d60424812df66aac919f
  cuda_arch: "120"

package:
  name: pycolmap
  version: "4.2.0"

source:
  git: https://github.com/colmap/colmap.git
  rev: ${{ colmap_rev }}
  # Paths resolve relative to this recipe directory.  Each file starts with a
  # `# Patch:` prose header, which every applier skips (nothing before the first
  # `diff --git` is parsed).  Order: hand-written first, then the generated tree;
  # the two path sets are disjoint.
  patches:
    - patches/add-opencv-fisheye-caspar-adapter.patch
    - patches/add-opencv-fisheye-generated-f32.patch

build:
  number: 0
  # Distinguishes this artifact from the fp32/fp64 stock-source builds, which
  # share the name and version `pycolmap 4.2.0`.
  string: caspar_fisheye_cuda130_py312
  script:
    # --- Step 0: prove the patches landed, byte for byte, before compiling ---
    # The applier inside pixi-build-rattler-build 0.4.6 (flickzeug 0.5.2) patches
    # with fuzz and can skip an already-applied hunk with a WARNING and exit 0.
    # A skipped hunk in solver.cc or caspar_mappings.cu would compile and give
    # wrong answers, so hash every file the two patches touch instead of
    # trusting the applier.  This costs under a second and runs before the
    # five-minute CUDA compile.
    - sha256sum --quiet -c "$RECIPE_DIR/patches/SHA256SUMS"
    # Cheap, readable corroboration of the same fact, in case the checksum file
    # itself is ever stale: the adapter class, the generator residual, and the
    # 224 new fp32 kernel files (104 kernel_OpenCVFisheye* plus 120
    # kernel_opencv_fisheye_*, hence the case-insensitive count).
    - grep -q "class OpenCVFisheyeAdapter" src/colmap/estimators/caspar/caspar_model_adapter.h
    - grep -q "opencv_fisheye" src/thirdparty/Symforce-Caspar/caspar_generate.py
    - test "$(ls src/thirdparty/Symforce-Caspar/generated/f32 | grep -ci fisheye)" -eq 224
    # conda's onnxruntime-cpp nests its headers at include/onnxruntime/core/session/,
    # but COLMAP includes <onnxruntime_cxx_api.h> flat (the prebuilt-release layout).
    # Put the session dir on the compiler's include search path so it resolves.
    - export CPATH="$PREFIX/include/onnxruntime/core/session${CPATH:+:$CPATH}"
    # --- Step 1: build + install libcolmap WITH caspar (the flag lives here) ---
    - >-
      cmake -S . -B build_colmap -GNinja
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX=$PREFIX
      -DCUDA_ENABLED=ON
      -DCASPAR_ENABLED=ON
      -DGUI_ENABLED=OFF
      -DTESTS_ENABLED=OFF
      -DFETCH_ONNX=OFF
      -DCMAKE_CUDA_ARCHITECTURES=${{ cuda_arch }}
      -DCMAKE_PREFIX_PATH=$PREFIX
    - cmake --build build_colmap --parallel ${{ CPU_COUNT }}
    - cmake --install build_colmap
    # --- Step 2: build the pycolmap bindings against our caspar libcolmap ---
    # GENERATE_STUBS=OFF keeps pybind11-stubgen (a git dependency of the
    # pyproject build-system table) out of the picture under --no-build-isolation.
    - export CMAKE_PREFIX_PATH="$PREFIX:${CMAKE_PREFIX_PATH:-}"
    # scikit-build-core drives the bindings through Unix Makefiles and, unlike
    # step 1's `cmake --build --parallel`, defaults to a SINGLE job.  ~120
    # pybind11 translation units at that rate cost ~25 minutes; this cuts it to
    # about one.  scikit-build-core reads CMAKE_BUILD_PARALLEL_LEVEL from the
    # environment.
    - export CMAKE_BUILD_PARALLEL_LEVEL=${{ CPU_COUNT }}
    - export CMAKE_ARGS="-DCASPAR_ENABLED=ON -DCMAKE_CUDA_ARCHITECTURES=${{ cuda_arch }} -DGENERATE_STUBS=OFF -DFETCH_ONNX=OFF -DCMAKE_PREFIX_PATH=$PREFIX"
    - python -m pip install . -vv --no-build-isolation --no-deps
    # --- Provenance inside the package, readable by probes and `pixi run` ---
    - mkdir -p "$PREFIX/etc/pycolmap-caspar"
    - printf 'fisheye_f32\n' > "$PREFIX/etc/pycolmap-caspar/variant"
    - printf '%s\n' "${{ colmap_rev }}" > "$PREFIX/etc/pycolmap-caspar/colmap_rev"

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    # Pin the build-side CUDA toolkit to ONE version (13.0) so nvcc and the
    # CCCL/cudart headers match — an unpinned cuda-nvcc grabs a newer toolkit
    # against 13.0 headers and trips the "compiler and toolkit headers are
    # incompatible" guard.
    - cuda-nvcc 13.0.*
    - cuda-version 13.0.*
    - cmake
    - ninja
    - make
    - git
    - libgomp
    # rattler-build needs patchelf for the final RPATH relink/packaging step.
    - patchelf
  host:
    - python 3.12.*
    - pip
    - scikit-build-core
    # pycolmap 4.2.0's build-system requires pybind11 3.x specifically.
    - pybind11 >=3.0,<4
    - numpy
    # --- COLMAP C++ dependencies (mirrors the conda-forge colmap 4.2.0 build,
    # minus qt-main / xorg, since GUI_ENABLED=OFF) ---
    - libboost-devel
    # COLMAP 4.2.0 links eigen 5 (eigen-abi >=5.0.1.80).
    - eigen
    - ceres-solver          # CPU Ceres stays — caspar is an *alternative* backend
    - poselib               # new hard dependency in 4.2.0
    - cgal-cpp
    - sqlite
    - flann
    - glog
    - gflags
    - freeimage
    - metis
    - gmp
    - lz4-c
    - libfaiss * *_cuda
    - openimageio
    # OpenImageIOConfig.cmake does find_dependency(fmt), so fmt's cmake package
    # must be present or the very first find_package(OpenImageIO) fails.
    - fmt
    # CUDA-13 onnxruntime (C++) for the ALIKED / LightGlue neural features.  With
    # FETCH_ONNX=OFF, COLMAP find_package()s this instead of downloading the
    # cuda12 GPU prebuilt, whose CUDA provider needs libcublasLt.so.12 (absent
    # in a CUDA 13 environment).
    - onnxruntime-cpp * *_cuda130
    # COLMAP's FindDependencies.cmake still requires OpenGL with GUI_ENABLED=OFF.
    - libgl-devel
    - libopengl-devel
    - libglx-devel
    - libegl-devel
    - glew
    # CUDA 13 toolchain, matching this repo's colsfm environment.
    - cuda-version 13.0.*
    - cuda-cudart-dev
    - libcurand-dev
    - libcublas-dev
    - libcusparse-dev
    - libcusolver-dev
  run:
    - python 3.12.*
    - numpy
    - libopenimageio
    - libfaiss
    - ceres-solver
    - poselib
    - onnxruntime-cpp * *_cuda130
  run_constraints:
    # This build only carries sm_120 kernels; a pre-Blackwell GPU would load the
    # library fine but fail at kernel launch.
    - __cuda >=13.0

tests:
  - script:
      - python -c "import pycolmap; assert pycolmap.has_cuda, 'built without CUDA'"
      - python -c "import pycolmap; assert hasattr(pycolmap.BundleAdjustmentOptions(), 'caspar')"
      # The two asserts above also pass on stock pycolmap.  This one does not:
      # the adapter's class name survives in the extension module's symbols
      # (0 hits in the stock fp32 and fp64 builds, 2 in this one).  Do not use
      # `OpenCVFisheye`: stock `_core*.so` carries it 18-27 times as
      # `OpenCVFisheyeCameraModel`.
      - python -c "import pathlib, pycolmap; p = pathlib.Path(pycolmap.__file__).parent; assert any(b'OpenCVFisheyeAdapter' in f.read_bytes() for f in p.glob('_core*.so')), 'OpenCVFisheyeAdapter not linked into pycolmap'"
      # sys.prefix, not $PREFIX: the rattler-build docs do not promise $PREFIX
      # inside a test script.
      - python -c "import pathlib, sys; assert (pathlib.Path(sys.prefix) / 'etc/pycolmap-caspar/variant').read_text().strip() == 'fisheye_f32'"

about:
  homepage: https://colmap.github.io/
  license: BSD-3-Clause
  summary: pycolmap 4.2.0 (colmap be5e2916 + committed OPENCV_FISHEYE Caspar adapter patches) with CASPAR_ENABLED, CUDA 13 / sm_120.
