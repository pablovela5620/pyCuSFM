[workspace]
name = "pycusfm"
version = "0.1.8"
description = "Pixi environment for the CUDA 13 pyCuSFM binaries"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pyyaml = "*"
pillow = "*"
setuptools = "<78"
# ── Rerun demo side (demo_rerun.py) ──
# rerun-sdk comes from PyPI (below): 0.37.1 is not on conda-forge yet (0.37.0 is).
numpy = "*"
scipy = "*"
av = "*"
pyarrow = "*"
einops = "*"
# Keep the tested 8.x major until the JPEG extraction path is validated on 9.x.
ffmpeg = "8.*"
# simplecv -> pyserde<0.32 requires typing-extensions <4.16, but the conda solve
# otherwise pins 4.16.0 and the pypi solve then has no solution. Documented in
# the add-model skill's fork-and-pixify reference.
typing-extensions = ">=4.1,<4.16"
cuda-version = "13.0.*"
cuda-cudart = "*"
libcublas = "*"
libcusparse = "*"
libcusolver = "*"

[pypi-dependencies]
pycusfm = { path = ".", editable = true }
tensorrt-cu13 = "==10.13.3.9.post1"
# Pinned exact: conda-forge lags PyPI for rerun (0.37.0 vs 0.37.1 at pin time), and the
# viewer that validates must be >= the SDK that wrote the data, so the pin is deliberate.
# The `catalog` extra adds datafusion, needed by rerun.catalog.CatalogClient.
rerun-sdk = { version = "==0.37.1", extras = ["catalog"] }
# simplecv supplies RerunTyroConfig, the camera dataclasses, and the exoego:v2
# rig logger. It is taken from the monorepo (public) rather than the standalone
# pablovela5620/simplecv, which predates rerun_rig_logger.py / rig.py.
# NOTE: never write `simplecv = "*"` — PyPI's `simplecv` is an unrelated 2013
# machine-vision package and would install silently in its place.
simplecv = { git = "https://github.com/rerun-io/examples-monorepo.git", subdirectory = "packages/simplecv" }
tyro = ">=0.9.1"
jaxtyping = "*"
beartype = "*"

[pypi-options.dependency-overrides]
tensorrt-cu12 = "==10.13.3.9.post1"
cuda-toolkit = ">=13,<14"

# RaCo-ALIKED export and TensorRT 10.13 benchmarking.  PyTorch is CPU-only:
# ONNX export does not need a GPU, and keeping CUDA PyTorch out of this feature
# avoids changing the CUDA/TensorRT libraries used by the frozen cuSFM binaries.
[feature.raco.dependencies]
python = "3.12.*"
onnx = "1.22.*"
cuda-python = "13.0.*"
cuda-version = "13.0.*"
cuda-cudart = "*"
libcublas = "*"
numpy = "==2.5.1"
pytest = "*"
ruff = "*"
setuptools = "*"

[feature.raco.pypi-dependencies]
lightglue-onnx = { git = "https://github.com/fabio-sim/LightGlue-ONNX.git", rev = "d12b4ba1632f558234e3f084e1f3d8bdf9147890" }
jaxtyping = "*"
onnxscript = "==0.7.1"
tensorrt-cu13 = "==10.13.3.9.post1"
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = "==0.28.0", index = "https://download.pytorch.org/whl/cpu" }
tyro = ">=0.9.1"

# The suite and the RaCo tools live in the `raco` environment, which is
# `no-default-feature`; `pixi run python -m pytest` from the default env fails
# with "No module named pytest". Feature-scoped tasks are the supported entry
# points, reachable as `pixi run -e raco <task>`.
[feature.raco.tasks]
test = { cmd = "python -m pytest tests/ -q", description = "Run the test suite" }
lint = { cmd = "ruff check demo_rerun.py tools tests", description = "Lint the demo, RaCo tools, and tests" }
raco-export = { cmd = "python -m tools.export_cusfm_raco", description = "Export RaCo-ALIKED + LightGlue to ONNX for cuSFM" }
raco-extract = { cmd = "python -m tools.raco_extract", description = "Write cuSFM keyframes with the batched RaCo extractor" }
raco-benchmark = { cmd = "python -m tools.benchmark_cusfm_extractors", description = "Benchmark stock ALIKED against RaCo-ALIKED" }

# MegaDepth-1500 benchmarking against the cuSFM paper's feature table.  This
# layers a GPU ONNX Runtime (CUDA 13 wheels) and Polygraphy on top of `raco`,
# which already carries OpenCV, typer, and fabio-sim's `lightglue_dynamo`.
# `raco` itself stays CPU-only on purpose, so the GPU runtime lives here.
[feature.bench.pypi-dependencies]
onnxruntime-gpu = { version = "==1.29.0", extras = ["cuda", "cudnn"] }
polygraphy = "*"
# The catalog-side MegaDepth benchmark ingests and queries through the same
# process that runs ONNX Runtime, so the Rerun SDK (with its `catalog` extra,
# which pulls datafusion) has to live in this environment too.
rerun-sdk = { version = "==0.37.1", extras = ["catalog"] }


# ── colsfm: the open Python + pycolmap pipeline (docs/open-pipeline-plan.md) ──
# Deliberately `no-default-feature` with its own solve group: the default
# environment is a fragile CUDA 13 + TensorRT solve around the frozen cuSFM
# binaries, and nothing here may perturb it.  pycolmap drags in ceres-solver,
# eigen 5, libopenimageio, glew and a second CUDA runtime; keeping the solve
# groups apart is what makes that safe.
# pixi does not feed `__cuda` to the solver unless the environment asks for it,
# even when `pixi info` reports `__cuda=13.0`.  Without this the cuda_130
# pycolmap build resolves to "no candidates were found" for `__cuda >=13.0`.
# pixi 0.77.1 prints a deprecation warning for this table and points at
# `platforms = [{ name = ..., platform = ..., cuda = ... }]`, but that form is
# (a) rejected by 0.77.1's own parser ("expected a string, found table") and
# (b) workspace-scoped, so it would re-solve the default environment.  The
# warning is accepted deliberately until pixi supports a feature-scoped form.
[feature.colsfm.system-requirements]
cuda = "13.0"

[feature.colsfm.dependencies]
python = "3.12.*"
# pycolmap 4.2.0 has cpu_*, cuda_129_* and cuda_130_* builds on conda-forge.
# `cuda-version = "13.0.*"` is NOT enough to pick the CUDA one: the cpu_* build
# carries no cuda-version constraint at all, so it satisfies the environment and
# the solver takes it (measured — the first solve here silently installed
# `pycolmap-4.2.0-cpu_h874a1db_0` and `pycolmap.has_cuda` was False).  The build
# string is what actually selects it.  pycolmap already depends on
# `colmap >=4.2.0,<4.3.0a0` (the C++ runtime library), so `colmap` does NOT
# need to be listed separately — it arrives as a transitive dependency.
pycolmap = { version = "4.2.0.*", build = "cuda_130*" }
# On conda-forge (2.6).  Needed for the pose-graph optimiser: pycolmap ships
# cost functions but no PGO driver, and pyceres is the Ceres binding COLMAP
# upstream itself uses.  No PyPI fallback is required.
pyceres = "2.6.*"
numpy = "*"
scipy = "*"
# The conda package for the Python protobuf runtime is `protobuf`
# (`libprotobuf` is the C++ side).  Needed to read the cuSFM `.pb.txt` configs.
protobuf = "*"
pyarrow = "*"
pillow = "*"
av = "*"
# Only for the interoperability probe: `tests/colsfm_probes/test_model_io.py`
# imports `demo_rerun.read_colmap_model` to check that a pycolmap-written
# `images.txt` survives the existing hand-rolled parser, and demo_rerun pulls in
# `pycusfm`, which imports yaml at module scope.
pyyaml = "*"
# Same reasoning as the default feature: keep the validated 8.x major.
ffmpeg = "8.*"
pytest = "*"
ruff = "*"
beartype = "*"
jaxtyping = "*"
tyro = "*"
# Must be `<0.32`, not `*`: simplecv 0.7.2 requires `pyserde>=0.31.2,<0.32`,
# and a bare `pyserde` lets the conda solver pin 0.32.1 first, after which the
# PyPI solve has no solution.  Same shape as the typing-extensions cap.
pyserde = ">=0.31.2,<0.32"
einops = "*"
cuda-version = "13.0.*"
cuda-cudart = "*"
# TensorRT engines resolve cuBLAS at load time.
libcublas = "*"
# ONNX Runtime's CUDA provider (pycolmap's native ALIKED + LightGlue) needs cuDNN;
# without it COLMAP's worker thread SIGABRTs and colsfm.features falls back to CPU.
cudnn = "9.*"
setuptools = "<78"
# Gotcha 5 in NOTES.md, hit again here: simplecv -> pyserde<0.32 caps
# typing-extensions at <4.16, but the conda solve otherwise pins 4.16.0 and the
# PyPI solve then has no solution.  Declared conda-side, exactly as the default
# feature does, so that one solver owns the constraint.
typing-extensions = ">=4.1,<4.16"

[feature.colsfm.pypi-dependencies]
# Gotcha 1: `10.13.3.9` (no `.post1`) depends on the retired
# `nvidia-cuda-runtime-cu13==0.0.1` and cannot resolve.
tensorrt-cu13 = "==10.13.3.9.post1"
# Pinned exact for the same reason as the default feature: the validating
# viewer must be >= the writing SDK, and conda-forge lags at 0.37.0.
rerun-sdk = { version = "==0.37.1", extras = ["catalog"] }
# Gotcha 4: never `simplecv = "*"` — PyPI's `simplecv` is an unrelated 2013
# machine-vision package.  Only the monorepo copy has rerun_rig_logger.py.
simplecv = { git = "https://github.com/rerun-io/examples-monorepo.git", subdirectory = "packages/simplecv" }

# Gotcha 2 is a property of `pycusfm`'s own `pyproject.toml`, which this feature
# does not install (no editable self-dependency here).  The override is repeated
# anyway because `[pypi-options]` at the workspace level belongs to the default
# feature, and a `no-default-feature` environment does not inherit it; without
# it a future `tensorrt-cu12` edge would silently reintroduce the CUDA 12 stack.
[feature.colsfm.pypi-options.dependency-overrides]
tensorrt-cu12 = "==10.13.3.9.post1"
cuda-toolkit = ">=13,<14"

# The TensorRT wheels ship their `.so` files in `site-packages/tensorrt_libs`,
# which is on no RPATH.  Appended (not prepended) so that conda-forge's own
# CUDA libraries keep priority for pycolmap.
[feature.colsfm.activation.env]
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${CONDA_PREFIX}/lib/python3.12/site-packages/tensorrt_libs"

[feature.colsfm.tasks]
colsfm-probe = { cmd = "python -m pytest tests/colsfm_probes -q", description = "Run the pycolmap capability probe suite" }
colsfm-lint = { cmd = "ruff check tests/colsfm_probes", description = "Lint the pycolmap probe suite" }

[environments]
raco = { features = ["raco"], no-default-feature = true, solve-group = "raco" }
bench = { features = ["raco", "bench"], no-default-feature = true }
colsfm = { features = ["colsfm"], no-default-feature = true, solve-group = "colsfm" }

[activation.env]
LD_LIBRARY_PATH = "${PIXI_PROJECT_ROOT}/pycusfm/x86_cuda13/lib:${CONDA_PREFIX}/lib/python3.12/site-packages/tensorrt_libs:${CONDA_PREFIX}/lib:/usr/lib/x86_64-linux-gnu"

[tasks]
select-tensorrt-cu13 = "pixi reinstall tensorrt-cu13-libs tensorrt-cu13-bindings --no-progress"
setup-cuda13-bin = { cmd = "ln -sfn x86_cuda13/bin pycusfm/bin", depends-on = ["select-tensorrt-cu13"] }
setup-cuda13-lib = { cmd = "ln -sfn x86_cuda13/lib pycusfm/lib", depends-on = ["select-tensorrt-cu13"] }
setup-cuda13 = { depends-on = ["setup-cuda13-bin", "setup-cuda13-lib"] }
check-libs = { cmd = """bash -ec '
status=0
for binary in pycusfm/x86_cuda13/bin/*; do
    missing="$(ldd "$binary" | awk "/not found/")"
    if [ -n "$missing" ]; then
        printf "%s\n%s\n" "$binary" "$missing"
        status=1
    fi
done
if [ "$status" -eq 0 ]; then
    echo "All CUDA 13 binary dependencies found."
fi
exit "$status"
'""", depends-on = ["setup-cuda13"] }
cusfm-help = { cmd = "cusfm_cli --help", depends-on = ["setup-cuda13"] }


# ── Rerun demos ──
# demo_rerun.py auto-fetches the RoboCap segment from the catalog when
# data/robocap/s00000021.rrd is absent, so there is no separate fetch task.
demo = { cmd = "python demo_rerun.py dataset:galileo", depends-on = ["setup-cuda13"], description = "cuSFM on the bundled r2b_galileo sample, shown in Rerun" }
demo-robocap = { cmd = "python demo_rerun.py dataset:robocap", depends-on = ["setup-cuda13"], description = "cuSFM on the RoboCap fisheye segment, shown in Rerun" }
prepare-galileo-output = "mkdir -p data/cusfm_runs/galileo"
demo-upstream = { cmd = """bash -o pipefail -ec '
/usr/bin/time -f "wall_seconds=%e" python -u -m pycusfm.cusfm_cli \
    --input_dir data/r2b_galileo \
    --cusfm_base_dir data/cusfm_runs/galileo 2>&1 \
    | tee data/cusfm_runs/galileo/demo-upstream.log
'""", depends-on = ["setup-cuda13", "prepare-galileo-output"] }
